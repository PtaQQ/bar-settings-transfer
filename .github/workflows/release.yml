name: release

# Push a tag like v1.2.0 to test, build both zips and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zips
        run: python tools/build_release.py "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then notes=(--notes-file RELEASE_NOTES.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "BAR Settings Transfer $GITHUB_REF_NAME" "${notes[@]}"

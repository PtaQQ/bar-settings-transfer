name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # windows-latest runs both implementations (powershell.exe is Windows PowerShell 5.1);
      # ubuntu-latest runs the Python tool and the PowerShell tool under pwsh.
      - name: Tests
        run: python -m unittest discover -s tests -v
